<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 675px;
      overflow: hidden;
      background: #2B3036;
    }
    .frame {
      position: relative;
      width: 1200px;
      height: 675px;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(43,48,54,0.62) 0%, rgba(43,48,54,0.28) 42%, rgba(43,48,54,0.78) 100%),
        linear-gradient(0deg, rgba(247,245,241,0.18) 0%, transparent 45%);
    }
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700;
      font-size: 92px;
      letter-spacing: 0.25em;
      line-height: 1;
      color: #fff;
      margin-left: -0.05em;
    }
    .eyebrow {
      margin-top: 22px;
      font-weight: 300;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.9);
      max-width: 920px;
    }
    .headline {
      margin-top: 36px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: 52px;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #fff;
      max-width: 980px;
    }
    .sub {
      margin-top: 22px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: 28px;
      line-height: 1.3;
      color: rgba(255,255,255,0.9);
      max-width: 860px;
    }
    .mark {
      position: absolute;
      top: 48px;
      right: 64px;
      width: 48px;
      height: 48px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img
      class="bg"
      src="https://media.base44.com/images/public/6a8e40cf6b6b2dae667b4c8e/f787fe8df_generated_b3bd0ffb.png"
      alt=""
    />
    <div class="overlay"></div>
    <svg class="mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="24" r="9" stroke="#F7F5F1" stroke-width="2.5"/>
      <line x1="12" y1="44" x2="52" y2="44" stroke="#8FA094" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div class="content">
      <div class="logo">PSYTY</div>
      <p class="eyebrow">Первый в мире город психологов, исследователей и ученых.</p>
      <h1 class="headline">Жить, учиться и работать в среде,<br />своей среде.</h1>
      <p class="sub">Среда для человека, исследующего и развивающего в человеке Человека.</p>
    </div>
  </div>
</body>
</html>
